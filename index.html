<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Демонстрационный интерфейс доставки суши во Внуково"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sushi Vnukovo Demo</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f6f1ec;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #f6f1ec;
        background-image: url('/images/bg-mobile.png');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        opacity: 1;
        transition: opacity 260ms ease-out, visibility 260ms ease-out;
      }

      #app-loader.app-loader-hidden {
        opacity: 0;
        visibility: hidden;
      }

      @media (min-width: 768px) {
        #app-loader {
          background-image: url('/images/bg-desktop.png');
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
